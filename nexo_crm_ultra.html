<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="description" content="App CRM - Plataforma SaaS moderna para gestión comercial, pipeline y cotizaciones.">
  <title>App CRM · Workspace Comercial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root {
      /* Light theme tokens */
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-elevated: #f1f5f9;
      --bg-hover: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-sub: #94a3b8;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --primary-glow: rgba(79, 70, 229, 0.18);
      --accent: #10b981;
      --accent-light: #ecfdf5;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --sidebar-bg: #0f172a;
      --sidebar-text: #e2e8f0;
      --sidebar-muted: #94a3b8;
      --sidebar-border: rgba(255, 255, 255, 0.08);
      --sidebar-active: #4f46e5;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      --glass: rgba(255, 255, 255, 0.85);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --radius-full: 9999px;
      --sidebar-w: 260px;
      --topbar-h: 70px;
    }

    html.dark {
      /* Dark theme tokens */
      --bg-base: #090d16;
      --bg-surface: #0f172a;
      --bg-card: #131d31;
      --bg-elevated: #1e293b;
      --bg-hover: #27354f;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --border: #1e293b;
      --border-subtle: #131d31;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-light: rgba(99, 102, 241, 0.15);
      --primary-glow: rgba(99, 102, 241, 0.25);
      --accent: #10b981;
      --accent-light: rgba(16, 185, 129, 0.15);
      --accent-glow: rgba(16, 185, 129, 0.25);
      --warning: #f59e0b;
      --warning-light: rgba(245, 158, 11, 0.15);
      --danger: #f87171;
      --danger-light: rgba(239, 68, 68, 0.15);
      --sidebar-bg: #070b14;
      --sidebar-text: #f8fafc;
      --sidebar-muted: #64748b;
      --sidebar-border: rgba(255, 255, 255, 0.05);
      --sidebar-active: #6366f1;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 8px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 20px -3px rgba(0, 0, 0, 0.45);
      --shadow-xl: 0 25px 35px -5px rgba(0, 0, 0, 0.55);
      --glass: rgba(15, 23, 42, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Common interactive styling */
    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: transparent; }
    a { color: inherit; text-decoration: none; }
    [hidden] { display: none !important; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-sub); }

    /* Layout Shell */
    .app-layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Sidebar Design */
    .sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 20px 16px;
      user-select: none;
      z-index: 40;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 24px 8px;
      border-bottom: 1px solid var(--sidebar-border);
    }
    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #10b981 100%);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .brand-version {
      font-size: 10px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .nav-group {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      overflow-y: auto;
    }
    .nav-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sidebar-muted);
      font-weight: 700;
      padding: 8px 12px 4px 12px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      color: var(--sidebar-muted);
      font-weight: 600;
      font-size: 13px;
      transition: all 0.18s ease;
      position: relative;
    }
    .nav-item i { font-size: 16px; width: 20px; text-align: center; }
    .nav-item:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .nav-item.active {
      color: #fff;
      background: var(--sidebar-active);
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .nav-badge {
      margin-left: auto;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .nav-item.active .nav-badge {
      background: #fff;
      color: var(--primary);
    }

    .sidebar-footer {
      border-top: 1px solid var(--sidebar-border);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
    }
    .user-pill .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--primary);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 12px;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 11px; color: var(--sidebar-muted); }

    .workspace {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-base);
    }
    .topbar {
      height: var(--topbar-h);
      padding: 0 28px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 30;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .topbar-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text-main);
    }
    .topbar-badge {
      padding: 3px 8px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      background: var(--primary-light);
      color: var(--primary);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-command-shortcut {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: var(--radius-full);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-command-shortcut:hover {
      border-color: var(--primary);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }
    .kbd-tag {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      font-family: monospace;
    }

    .top-action-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-size: 15px;
      transition: all 0.18s ease;
      position: relative;
    }
    .top-action-btn:hover {
      color: var(--text-main);
      background: var(--bg-hover);
      border-color: var(--text-sub);
    }
    .top-badge-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-card);
    }

    /* Content Area */
    .main-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      scroll-behavior: smooth;
    }

    /* Buttons & Form Controls */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 13px;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px var(--primary-glow);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .btn-accent {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .btn-accent:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
    }
    .btn-secondary:hover {
      background: var(--bg-hover);
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: var(--radius-sm);
    }
    .btn-icon-only {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: var(--radius-sm);
    }

    /* Cards & Containers */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      border-color: rgba(99, 102, 241, 0.25);
    }

    /* Metric Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--stat-bar, var(--primary));
    }
    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: var(--stat-bg, var(--primary-light));
      color: var(--stat-color, var(--primary));
      display: grid;
      place-items: center;
      font-size: 16px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      margin: 12px 0 4px 0;
      letter-spacing: -1px;
      color: var(--text-main);
    }
    .stat-desc {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-trend {
      font-weight: 700;
      color: var(--accent);
    }

    .kanban-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(280px, 1fr));
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 20px;
      height: calc(100vh - 230px);
      min-height: 480px;
    }
    .kanban-col {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .kanban-col.dragover {
      background: var(--primary-light);
      border-color: var(--primary);
    }
    .kanban-col-head {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .col-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .col-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--col-color, var(--primary));
    }
    .col-name {
      font-weight: 800;
      font-size: 13px;
    }
    .col-count {
      background: var(--bg-elevated);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .col-total {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .kanban-cards-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .deal-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      cursor: grab;
      user-select: none;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .deal-item:active { cursor: grabbing; }
    .deal-item.dragging {
      opacity: 0.4;
      transform: scale(0.96) rotate(1deg);
    }
    .deal-item:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .deal-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }
    .deal-title {
      font-weight: 700;
      font-size: 13px;
      line-height: 1.3;
      color: var(--text-main);
    }
    .deal-company {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .deal-value {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.3px;
      margin-bottom: 10px;
    }
    .deal-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      font-size: 11px;
    }
    .deal-owner {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .deal-stale-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--warning-light);
      color: var(--warning);
    }
    .deal-stale-tag.urgent {
      background: var(--danger-light);
      color: var(--danger);
    }

    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .toolbar-bar {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 400px;
    }
    .search-input-wrap i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }
    .search-input-wrap input {
      width: 100%;
      height: 38px;
      padding: 0 12px 0 36px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      color: var(--text-main);
      font-size: 13px;
      transition: all 0.18s ease;
    }
    .search-input-wrap input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: var(--bg-surface);
    }
    .filter-select {
      height: 38px;
      padding: 0 14px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .modern-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .modern-table th {
      background: var(--bg-elevated);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
    }
    .modern-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      font-size: 13px;
      vertical-align: middle;
    }
    .modern-table tbody tr {
      transition: background 0.15s ease;
    }
    .modern-table tbody tr:hover {
      background: var(--bg-elevated);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
    }
    .badge-primary { background: var(--primary-light); color: var(--primary); }
    .badge-accent { background: var(--accent-light); color: var(--accent); }
    .badge-warning { background: var(--warning-light); color: var(--warning); }
    .badge-danger { background: var(--danger-light); color: var(--danger); }
    .badge-neutral { background: var(--bg-hover); color: var(--text-muted); }

    .command-palette-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 16px;
      animation: fadeIn 0.15s ease;
    }
    .command-dialog {
      width: min(580px, 100%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      animation: scaleUp 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .command-search-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .command-search-header i {
      font-size: 18px;
      color: var(--primary);
    }
    .command-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }
    .command-list {
      max-height: 340px;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .command-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .command-item:hover, .command-item.focused {
      background: var(--primary-light);
      color: var(--primary);
    }
    .command-item i { font-size: 16px; width: 20px; text-align: center; }
    .command-item-action { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--text-sub); }
    .command-footer {
      background: var(--bg-elevated);
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 11px;
    }

    /* Modal windows */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      z-index: 90;
      display: grid;
      place-items: center;
      padding: 16px;
      overflow-y: auto;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      width: min(600px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      animation: scaleUp 0.18s ease;
      overflow: hidden;
    }
    .modal-box.wide { width: min(840px, 100%); }
    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 16px; font-weight: 800; color: var(--text-main); }
    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      background: var(--bg-surface);
    }

    /* Form Fields */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group.col-span-2 { grid-column: span 2; }
    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .form-control {
      height: 40px;
      padding: 0 12px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 13px;
      transition: all 0.18s ease;
    }
    textarea.form-control {
      height: 90px;
      padding: 10px 12px;
      resize: vertical;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: var(--bg-surface);
    }

    /* Toast Notifications */
    .toast-center {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
      pointer-events: none;
    }
    .toast-msg {
      background: var(--sidebar-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xl);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideLeft 0.2s ease;
      pointer-events: auto;
    }
    .toast-msg i { color: var(--accent); font-size: 16px; }
    .toast-msg.error i { color: var(--danger); }

    .login-wrapper {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%),
                  var(--bg-base);
    }
    .login-card-pro {
      width: min(440px, 100%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-xl);
    }
    .login-brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo-circle {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #10b981 100%);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      margin: 0 auto 14px auto;
      box-shadow: 0 0 24px var(--primary-glow);
    }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleUp { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideLeft { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    /* Responsive Mobile Handling */
    @media (max-width: 900px) {
      .app-layout { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        transform: translateX(-100%);
      }
      .app-layout.drawer-open .sidebar {
        transform: translateX(0);
      }
      .drawer-dimmer {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        z-index: 35;
      }
      .btn-command-shortcut { display: none; }
      .kanban-board { grid-template-columns: repeat(5, 270px); }
    }
  </style>
</head>
<body>

  <script>
    /* Nexo CRM Unified Logic Core */
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx1odNoI5JskikYcPeaobBt6Ki3F7SA3IAEOL4DaNBGzLymuE9bwICslv5NHTQWj0aq/exec';
    const IS_REMOTE = /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(APPS_SCRIPT_URL);

    const STAGES = ['Nuevo', 'Contactado', 'Propuesta', 'Negociación', 'Ganado'];
    const STAGE_COLORS = {
      'Nuevo': '#6366f1',
      'Contactado': '#38bdf8',
      'Propuesta': '#fbbf24',
      'Negociación': '#f97316',
      'Ganado': '#10b981',
      'Perdido': '#64748b'
    };

    const state = {
      theme: localStorage.getItem('nexo_theme') || 'dark',
      view: 'dashboard',
      user: null,
      search: '',
      filter: 'Todos',
      contacts: [],
      opportunities: [],
      followUps: [],
      conversations: [],
      quotes: [],
      sellers: [],
      settings: { companyName: 'Nexo Studio', staleDays: 5 }
    };

    // DOM Utilities
    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => [...r.querySelectorAll(s)];

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      })[m]);
    }

    function formatCurrency(val, cur = 'ARS') {
      const num = Number(val) || 0;
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: cur, maximumFractionDigits: 0 }).format(num);
    }

    function formatDate(val) {
      if (!val) return 'Sin fecha';
      const d = new Date(val.length === 10 ? val + 'T12:00:00' : val);
      return Number.isNaN(d.getTime()) ? 'Sin fecha' : new Intl.DateTimeFormat('es-AR', { day: '2-digit', month: 'short' }).format(d);
    }

    function daysSince(val) {
      if (!val) return 0;
      const d = new Date(val);
      return Math.max(0, Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24)));
    }

    function toast(title, isError = false) {
      const el = document.createElement('div');
      el.className = `toast-msg ${isError ? 'error' : ''}`;
      el.innerHTML = `<i class="bi bi-${isError ? 'exclamation-octagon' : 'check2-circle'}"></i> <span>${escapeHtml(title)}</span>`;
      $('#toastSlot').appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    function applyTheme(theme) {
      state.theme = theme;
      localStorage.setItem('nexo_theme', theme);
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        $('#themeIcon').className = 'bi bi-sun';
      } else {
        document.documentElement.classList.remove('dark');
        $('#themeIcon').className = 'bi bi-moon-stars';
      }
    }

    function getSeedData() {
      const now = Date.now();
      return {
        user: { id: 'USR-1', name: 'Martina Rossi', email: 'martina@nexo.local', role: 'admin' },
        sellers: [
          { id: 'USR-1', name: 'Martina Rossi', email: 'martina@nexo.local', role: 'admin' },
          { id: 'USR-2', name: 'Facundo Vega', email: 'facundo@nexo.local', role: 'seller' },
          { id: 'USR-3', name: 'Carla Morales', email: 'carla@nexo.local', role: 'seller' }
        ],
        contacts: [
          { id: 'C-1', name: 'Alejandro Ramos', company: 'Nova Retail Corp', email: 'aramos@novaretail.com', phone: '+54 11 4400 9921', status: 'Cliente', source: 'LinkedIn', owner: 'Martina Rossi', updatedAt: new Date(now - 86400000).toISOString() },
          { id: 'C-2', name: 'Beatriz Silva', company: 'Logística Austral', email: 'bsilva@austral.ar', phone: '+54 261 422 1109', status: 'Prospecto', source: 'Web Inbound', owner: 'Facundo Vega', updatedAt: new Date(now - 86400000 * 4).toISOString() },
          { id: 'C-3', name: 'Gonzalo Méndez', company: 'Kroma Brand Lab', email: 'gmendez@kromalab.io', phone: '+54 351 555 8762', status: 'Prospecto', source: 'Referido', owner: 'Carla Morales', updatedAt: new Date(now - 86400000 * 8).toISOString() },
          { id: 'C-4', name: 'Lorena Fuentes', company: 'Valle Solar', email: 'lfuentes@vallesolar.com', phone: '+54 11 6789 2210', status: 'Cliente', source: 'Evento B2B', owner: 'Martina Rossi', updatedAt: new Date(now - 86400000 * 2).toISOString() }
        ],
        opportunities: [
          { id: 'O-1', title: 'Implementación ERP SaaS', contactId: 'C-1', value: 4200000, stage: 'Propuesta', probability: 60, owner: 'Martina Rossi', expectedClose: '2026-10-15', lastActivity: new Date(now - 86400000 * 2).toISOString() },
          { id: 'O-2', title: 'Módulo de Rutas Logísticas', contactId: 'C-2', value: 2800000, stage: 'Nuevo', probability: 20, owner: 'Facundo Vega', expectedClose: '2026-11-01', lastActivity: new Date(now - 86400000 * 6).toISOString() },
          { id: 'O-3', title: 'Rediseño Portal y Apps', contactId: 'C-3', value: 1950000, stage: 'Negociación', probability: 80, owner: 'Carla Morales', expectedClose: '2026-09-30', lastActivity: new Date(now - 86400000 * 1).toISOString() },
          { id: 'O-4', title: 'Capacitación Enterprise', contactId: 'C-4', value: 950000, stage: 'Ganado', probability: 100, owner: 'Martina Rossi', expectedClose: '2026-09-10', lastActivity: new Date(now - 86400000 * 12).toISOString() }
        ],
        followUps: [
          { id: 'F-1', title: 'Presentación de propuesta técnica', dueAt: new Date(now + 3600000 * 5).toISOString(), type: 'Reunión', owner: 'Martina Rossi', status: 'Pendiente', contactId: 'C-1' },
          { id: 'F-2', title: 'Llamada de seguimiento propuesta', dueAt: new Date(now - 3600000 * 4).toISOString(), type: 'Llamada', owner: 'Facundo Vega', status: 'Pendiente', contactId: 'C-2' },
          { id: 'F-3', title: 'Enviar contrato firmado', dueAt: new Date(now + 86400000).toISOString(), type: 'WhatsApp', owner: 'Carla Morales', status: 'Pendiente', contactId: 'C-3' }
        ],
        conversations: [
          { id: 'CONV-1', contactId: 'C-1', channel: 'Reunión', direction: 'Entrante', summary: 'Revisión final de presupuesto. Solicitan incluir 3 licencias extra.', owner: 'Martina Rossi', createdAt: new Date(now - 86400000).toISOString() },
          { id: 'CONV-2', contactId: 'C-2', channel: 'WhatsApp', direction: 'Saliente', summary: 'Se envió ficha técnica actualizada y cronograma tentativo.', owner: 'Facundo Vega', createdAt: new Date(now - 86400000 * 3).toISOString() }
        ],
        quotes: [
          {
            id: 'Q-1', quoteNumber: 'COT-2026-001', contactId: 'C-1', subtotal: 4200000, taxRate: 21, taxAmount: 882000, total: 5082000, currency: 'ARS',
            status: 'Enviada', validUntil: '2026-10-20', itemsJson: JSON.stringify([{ description: 'Licencia SaaS Anual', quantity: 1, price: 3200000, total: 3200000 }, { description: 'Onboarding y Setup', quantity: 1, price: 1000000, total: 1000000 }]),
            notes: 'Condición de pago: 50% anticipo y 50% contra entrega.', owner: 'Martina Rossi', createdAt: new Date(now - 86400000 * 2).toISOString()
          }
        ]
      };
    }

    function loadLocalData() {
      const saved = localStorage.getItem('nexo_ultra_data');
      const data = saved ? JSON.parse(saved) : getSeedData();
      Object.assign(state, data);
    }

    function saveLocalData() {
      localStorage.setItem('nexo_ultra_data', JSON.stringify({
        contacts: state.contacts,
        opportunities: state.opportunities,
        followUps: state.followUps,
        conversations: state.conversations,
        quotes: state.quotes,
        sellers: state.sellers,
        settings: state.settings,
        user: state.user
      }));
    }

    function renderDashboard() {
      const openDeals = state.opportunities.filter(o => !['Ganado', 'Perdido'].includes(o.stage));
      const wonDeals = state.opportunities.filter(o => o.stage === 'Ganado');
      const totalPipeline = openDeals.reduce((sum, o) => sum + (Number(o.value) || 0), 0);
      const totalWon = wonDeals.reduce((sum, o) => sum + (Number(o.value) || 0), 0);
      const overdueTasks = state.followUps.filter(f => f.status !== 'Completado' && new Date(f.dueAt).getTime() < Date.now());

      return `
      <div class="stats-grid">
        <div class="stat-card" style="--stat-bar: #6366f1; --stat-bg: var(--primary-light); --stat-color: var(--primary);">
          <div class="stat-header"><span>Pipeline Abierto</span><div class="stat-icon"><i class="bi bi-funnel"></i></div></div>
          <div class="stat-value">${formatCurrency(totalPipeline)}</div>
          <div class="stat-desc"><span class="stat-trend">${openDeals.length}</span> negocios en negociación activa</div>
        </div>
        <div class="stat-card" style="--stat-bar: #10b981; --stat-bg: var(--accent-light); --stat-color: var(--accent);">
          <div class="stat-header"><span>Ventas Ganadas</span><div class="stat-icon"><i class="bi bi-trophy"></i></div></div>
          <div class="stat-value">${formatCurrency(totalWon)}</div>
          <div class="stat-desc"><span class="stat-trend" style="color:var(--accent);">+18%</span> vs mes anterior</div>
        </div>
        <div class="stat-card" style="--stat-bar: #f59e0b; --stat-bg: var(--warning-light); --stat-color: var(--warning);">
          <div class="stat-header"><span>Seguimientos Pendientes</span><div class="stat-icon"><i class="bi bi-calendar-event"></i></div></div>
          <div class="stat-value">${state.followUps.filter(f => f.status !== 'Completado').length}</div>
          <div class="stat-desc" style="color: ${overdueTasks.length ? 'var(--danger)' : 'var(--text-muted)'};">
            ${overdueTasks.length ? `${overdueTasks.length} vencidos que requieren atención` : 'Todo al día'}
          </div>
        </div>
        <div class="stat-card" style="--stat-bar: #38bdf8; --stat-bg: rgba(56, 189, 248, 0.15); --stat-color: #38bdf8;">
          <div class="stat-header"><span>Tasa de Conversión</span><div class="stat-icon"><i class="bi bi-lightning-charge"></i></div></div>
          <div class="stat-value">${state.opportunities.length ? Math.round((wonDeals.length / state.opportunities.length) * 100) : 0}%</div>
          <div class="stat-desc">Promedio general del equipo</div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;" class="dashboard-cols">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <div>
              <h2 style="font-size: 15px; font-weight: 800;">Volumen de Oportunidades por Etapa</h2>
              <p style="font-size: 12px; color: var(--text-muted);">Forecast comercial en tiempo real</p>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="navigateTo('pipeline')">Ver Embudo <i class="bi bi-arrow-right"></i></button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 14px;">
            ${STAGES.map(stage => {
              const items = state.opportunities.filter(o => o.stage === stage);
              const val = items.reduce((s, o) => s + (Number(o.value) || 0), 0);
              const pct = totalPipeline ? Math.min(100, Math.round((val / totalPipeline) * 100)) : 0;
              return `
              <div>
                <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 6px;">
                  <span style="display:flex; align-items:center; gap: 6px;">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: ${STAGE_COLORS[stage]};"></span>
                    ${stage} (${items.length})
                  </span>
                  <span>${formatCurrency(val)}</span>
                </div>

          return `
          <div class="kanban-col" data-stage="${stage}" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${stage}')">

                return `
                <div class="deal-item" draggable="true" ondragstart="handleDragStart(event, '${d.id}')" onclick="openModalOpportunity('${d.id}')">

            </div>
          </div>`;
        }).join('')}
      </div>
      `;

    let draggedOpportunityId = null;
    function handleDragStart(e, id) {
      draggedOpportunityId = id;
      e.dataTransfer.setData('text/plain', id);
      e.currentTarget.classList.add('dragging');
    }
    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('dragover');
    }
    function handleDragLeave(e) {
      e.currentTarget.classList.remove('dragover');
    }
    function handleDrop(e, newStage) {
      e.preventDefault();
      e.currentTarget.classList.remove('dragover');
      if (!draggedOpportunityId) return;
      const opp = state.opportunities.find(o => o.id === draggedOpportunityId);
      if (opp && opp.stage !== newStage) {
        opp.stage = newStage;
        opp.lastActivity = new Date().toISOString();
        saveLocalData();
        renderView();
        toast(`Oportunidad movida a ${newStage}`);
      }
      draggedOpportunityId = null;
    }

    function exportContactsCSV() {
      if (!state.contacts.length) {
        toast('No hay contactos para exportar', true);
        return;
      }
      const headers = ['Nombre', 'Empresa', 'Email', 'Telefono', 'Estado', 'Origen', 'Responsable'];
      const rows = state.contacts.map(c => [
        `"${c.name || ''}"`,
        `"${c.company || ''}"`,
        `"${c.email || ''}"`,
        `"${c.phone || ''}"`,
        `"${c.status || ''}"`,
        `"${c.source || ''}"`,
        `"${c.owner || ''}"`
      ]);
      const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `Contactos_NexoCRM_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      toast('Exportación CSV completada');
    }

        closeModal();
        renderView();
        toast('Contacto guardado con éxito');
      };
    }

    function openModalOpportunity(id = null) {
      const opp = state.opportunities.find(x => x.id === id) || {};
      $('#modalSlot').innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-box">
          <div class="modal-header">
            <h3 class="modal-title">${opp.id ? 'Editar Oportunidad' : 'Nueva Oportunidad'}</h3>
            <button class="top-action-btn" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
          </div>
          <form id="oppForm">
            <div class="modal-body form-grid">
              <div class="form-group col-span-2">
                <label class="form-label">Título del Negocio *</label>
                <input class="form-control" name="title" value="${escapeHtml(opp.title || '')}" required>
              </div>
              <div class="form-group">
                <label class="form-label">Contacto Asociado</label>
                <select class="form-control" name="contactId">
                  ${state.contacts.map(c => `<option value="${c.id}" ${opp.contactId === c.id ? 'selected' : ''}>${escapeHtml(c.name)} (${escapeHtml(c.company || 'Personal')})</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Valor Estimado ($)</label>
                <input class="form-control" type="number" name="value" value="${opp.value || ''}" required>
              </div>
              <div class="form-group">
                <label class="form-label">Etapa</label>
                <select class="form-control" name="stage">
                  ${STAGES.map(s => `<option value="${s}" ${opp.stage === s ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Probabilidad (%)</label>
                <input class="form-control" type="number" name="probability" value="${opp.probability ?? 25}" min="0" max="100">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar Negocio</button>
            </div>
          </form>
        </div>
      </div>`;

      $('#oppForm').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        if (opp.id) {
          Object.assign(opp, Object.fromEntries(fd));
          opp.lastActivity = new Date().toISOString();
        } else {
          state.opportunities.push({
            id: 'O-' + Date.now(),
            owner: state.user.name,
            lastActivity: new Date().toISOString(),
            ...Object.fromEntries(fd)
          });
        }
        saveLocalData();
        closeModal();
        renderView();
        toast('Oportunidad actualizada');
      };
    }

    function openModalFollowUp() {
      $('#modalSlot').innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-box">
          <div class="modal-header">
            <h3 class="modal-title">Programar Seguimiento</h3>
            <button class="top-action-btn" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
          </div>
          <form id="followUpForm">
            <div class="modal-body form-grid">
              <div class="form-group col-span-2">
                <label class="form-label">Asunto / Tarea *</label>
                <input class="form-control" name="title" placeholder="Ej: Llamada de presentación" required>
              </div>
              <div class="form-group">
                <label class="form-label">Tipo de Acción</label>
                <select class="form-control" name="type">
                  <option value="Llamada">Llamada</option>
                  <option value="Reunión">Reunión</option>
                  <option value="WhatsApp">WhatsApp</option>
                  <option value="Email">Email</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Contacto</label>
                <select class="form-control" name="contactId">
                  ${state.contacts.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
                </select>
              </div>
              <div class="form-group col-span-2">
                <label class="form-label">Fecha y Hora Límite</label>
                <input class="form-control" type="datetime-local" name="dueAt" required value="${new Date(Date.now() + 86400000).toISOString().slice(0, 16)}">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
              <button type="submit" class="btn btn-primary">Crear Tarea</button>
            </div>
          </form>
        </div>
      </div>`;

      $('#followUpForm').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        state.followUps.push({
          id: 'F-' + Date.now(),
          status: 'Pendiente',
          owner: state.user.name,
          ...Object.fromEntries(fd)
        });
        saveLocalData();
        closeModal();
        renderView();
        toast('Seguimiento añadido a la agenda');
      };
    }

    function openModalConversation() {
      $('#modalSlot').innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-box">
          <div class="modal-header">
            <h3 class="modal-title">Registrar Interacción</h3>
            <button class="top-action-btn" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
          </div>
          <form id="convForm">
            <div class="modal-body form-grid">
              <div class="form-group col-span-2">
                <label class="form-label">Contacto</label>
                <select class="form-control" name="contactId">
                  ${state.contacts.map(c => `<option value="${c.id}">${escapeHtml(c.name)} (${escapeHtml(c.company || '')})</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Canal</label>
                <select class="form-control" name="channel">
                  <option value="WhatsApp">WhatsApp</option>
                  <option value="Llamada">Llamada</option>
                  <option value="Email">Email</option>
                  <option value="Reunión">Reunión</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Dirección</label>
                <select class="form-control" name="direction">
                  <option value="Saliente">Saliente</option>
                  <option value="Entrante">Entrante</option>
                </select>
              </div>
              <div class="form-group col-span-2">
                <label class="form-label">Resumen de la Conversación *</label>
                <textarea class="form-control" name="summary" required placeholder="Detalles de lo conversado y siguientes compromisos..."></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
              <button type="submit" class="btn btn-primary">Registrar</button>
            </div>
          </form>
        </div>
      </div>`;

      $('#convForm').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        state.conversations.unshift({
          id: 'CONV-' + Date.now(),
          owner: state.user.name,
          createdAt: new Date().toISOString(),
          ...Object.fromEntries(fd)
        });
        saveLocalData();
        closeModal();
        renderView();
        toast('Conversación registrada');
      };
    }

    function openModalQuote(id = null) {
      const q = state.quotes.find(x => x.id === id) || {};
      $('#modalSlot').innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-box">
          <div class="modal-header">
            <h3 class="modal-title">${q.id ? 'Editar Cotización' : 'Nueva Cotización'}</h3>
            <button class="top-action-btn" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
          </div>
          <form id="quoteForm">
            <div class="modal-body form-grid">
              <div class="form-group col-span-2">
                <label class="form-label">Contacto</label>
                <select class="form-control" name="contactId">
                  ${state.contacts.map(c => `<option value="${c.id}" ${q.contactId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Monto Subtotal ($)</label>
                <input class="form-control" type="number" name="subtotal" value="${q.subtotal || ''}" required>
              </div>
              <div class="form-group">
                <label class="form-label">IVA / Impuestos (%)</label>
                <input class="form-control" type="number" name="taxRate" value="${q.taxRate ?? 21}">
              </div>
              <div class="form-group col-span-2">
                <label class="form-label">Condiciones / Notas</label>
                <textarea class="form-control" name="notes">${escapeHtml(q.notes || '')}</textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar Cotización</button>
            </div>
          </form>
        </div>
      </div>`;

      $('#quoteForm').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const subtotal = Number(fd.get('subtotal')) || 0;
        const taxRate = Number(fd.get('taxRate')) || 0;
        const taxAmount = (subtotal * taxRate) / 100;
        const total = subtotal + taxAmount;

        if (q.id) {
          Object.assign(q, {
            subtotal, taxRate, taxAmount, total,
            notes: fd.get('notes'),
            contactId: fd.get('contactId')
          });
        } else {
          state.quotes.unshift({
            id: 'Q-' + Date.now(),
            quoteNumber: `COT-2026-${String(state.quotes.length + 1).padStart(3, '0')}`,
            currency: 'ARS',
            status: 'Enviada',
            validUntil: new Date(Date.now() + 86400000 * 15).toISOString().slice(0, 10),
            itemsJson: JSON.stringify([{ description: 'Servicios Profesionales', quantity: 1, price: subtotal, total: subtotal }]),
            subtotal, taxRate, taxAmount, total,
            notes: fd.get('notes'),
            contactId: fd.get('contactId'),
            owner: state.user.name,
            createdAt: new Date().toISOString()
          });
        }
        saveLocalData();
        closeModal();
        renderView();
        toast('Cotización generada exitosamente');
      };
    }

    function completeFollowUp(id) {
      const f = state.followUps.find(x => x.id === id);
      if (f) {
        f.status = 'Completado';
        saveLocalData();
        renderView();
        toast('Seguimiento completado');
      }
    }

    function closeModal() {
      $('#modalSlot').innerHTML = '';
    }

    const COMMANDS = [
      { label: 'Ir al Resumen Dashboard', icon: 'bi-grid-1x2', action: () => navigateTo('dashboard') },
      { label: 'Ver Embudo de Ventas Kanban', icon: 'bi-kanban', action: () => navigateTo('pipeline') },
      { label: 'Ver Directorio de Contactos', icon: 'bi-people', action: () => navigateTo('contacts') },
      { label: 'Ver Agenda de Seguimientos', icon: 'bi-calendar2-check', action: () => navigateTo('followups') },
      { label: 'Ver Cotizaciones', icon: 'bi-receipt', action: () => navigateTo('quotes') },
      { label: 'Crear Nuevo Contacto', icon: 'bi-person-plus', action: () => openModalContact() },
      { label: 'Crear Nueva Oportunidad', icon: 'bi-plus-circle', action: () => openModalOpportunity() },
      { label: 'Programar Seguimiento', icon: 'bi-calendar-plus', action: () => openModalFollowUp() },
      { label: 'Registrar Conversación', icon: 'bi-chat-dots', action: () => openModalConversation() },
      { label: 'Exportar Contactos a CSV', icon: 'bi-download', action: () => exportContactsCSV() },
      { label: 'Alternar Modo Oscuro / Claro', icon: 'bi-circle-half', action: () => toggleTheme() }
    ];

    function openCommandPalette() {
      $('#commandPalette').hidden = false;
      $('#commandInput').value = '';
      renderCommandList('');
      setTimeout(() => $('#commandInput').focus(), 50);
    }
    function closeCommandPalette() {
      $('#commandPalette').hidden = true;
    }
    function renderCommandList(query) {
      const q = query.toLowerCase().trim();
      const filtered = COMMANDS.filter(c => c.label.toLowerCase().includes(q));
      $('#commandList').innerHTML = filtered.map((c, i) => `
        <div class="command-item ${i === 0 ? 'focused' : ''}" onclick="executeCommand(${COMMANDS.indexOf(c)})">
          <i class="bi ${c.icon}"></i>
          <span>${escapeHtml(c.label)}</span>
          <span class="command-item-action">Acción</span>
        </div>
      `).join('') || '<div style="padding:14px; text-align:center; color:var(--text-muted);">Sin resultados.</div>';
    }
    function executeCommand(index) {
      closeCommandPalette();
      COMMANDS[index]?.action();
    }

    function navigateTo(viewKey) {
      state.view = viewKey;
      state.search = '';
      state.filter = 'Todos';
      $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === viewKey));
      const titles = {
        dashboard: 'Resumen Comercial',
        pipeline: 'Embudo de Ventas Kanban',
        contacts: 'Directorio de Contactos',
        followups: 'Agenda de Seguimientos',
        conversations: 'Historial de Conversaciones',
        quotes: 'Propuestas & Cotizaciones',
        sellers: 'Panel de Vendedores'
      };
      $('#pageTitle').textContent = titles[viewKey] || 'Nexo CRM';
      renderView();
    }

    function renderView() {
      const viewRenderers = {
        dashboard: renderDashboard,
        pipeline: renderPipeline,
        contacts: renderContacts,
        followups: renderFollowUps,
        conversations: renderConversations,
        quotes: renderQuotes,
        sellers: renderSellers
      };
      $('#viewportArea').innerHTML = (viewRenderers[state.view] || renderDashboard)();
      $('#sidebarBadge').textContent = state.followUps.filter(f => f.status !== 'Completado').length;
    }

    function toggleTheme() {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark');
    }

    function initApp() {
      applyTheme(state.theme);
      loadLocalData();

      // Clock update
      const now = new Date();
      $('#liveClock').textContent = new Intl.DateTimeFormat('es-AR', { weekday: 'short', day: 'numeric', month: 'short' }).format(now);

      // Login form event
      $('#loginForm').onsubmit = (e) => {
        e.preventDefault();
        state.user = state.sellers[0];
        $('#loginScreen').hidden = true;
        $('#appShell').hidden = false;
        $('#userName').textContent = state.user.name;
        $('#userRole').textContent = state.user.role === 'admin' ? 'Administrador' : 'Vendedor';
        $('#userAvatar').textContent = state.user.name.slice(0, 2).toUpperCase();
        navigateTo('dashboard');
      };

      $('#btnQuickDemo').onclick = () => {
        $('#loginForm').requestSubmit();
      };

      $('#btnLogout').onclick = () => {
        $('#appShell').hidden = true;
        $('#loginScreen').hidden = false;
      };

      // Topbar buttons
      $('#btnThemeToggle').onclick = toggleTheme;
      $('#btnExportCSV').onclick = exportContactsCSV;
      $('#btnQuickCreate').onclick = openModalOpportunity;
      $('#btnOpenCommandPalette').onclick = openCommandPalette;

      // Nav buttons
      $$('.nav-item').forEach(btn => {
        btn.onclick = () => {
          navigateTo(btn.dataset.view);
          $('#appShell').classList.remove('drawer-open');
          $('#drawerDimmer').hidden = true;
        };
      });

      // Mobile Menu Toggle
      $('#btnMenuToggle').onclick = () => {
        $('#appShell').classList.add('drawer-open');
        $('#drawerDimmer').hidden = false;
      };
      $('#drawerDimmer').onclick = () => {
        $('#appShell').classList.remove('drawer-open');
        $('#drawerDimmer').hidden = true;
      };

      // Command palette events
      $('#commandInput').oninput = (e) => renderCommandList(e.target.value);
      $('#commandPalette').onclick = (e) => {
        if (e.target === $('#commandPalette')) closeCommandPalette();
      };

      // Keyboard shortcuts
      window.onkeydown = (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          if ($('#commandPalette').hidden) openCommandPalette(); else closeCommandPalette();
        }
        if (e.key === 'Escape') {
          closeCommandPalette();
          closeModal();
        }
      };

      // Direct auto-login in local demonstration preview
      $('#loginForm').requestSubmit();
    }

    // Launch application on DOM ready
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
