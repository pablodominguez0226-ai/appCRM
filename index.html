<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Nexo CRM Ultra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --accent: #10b981;
      --accent-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fef3c7;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --radius-xl: 20px;
      --radius-lg: 12px;
      --radius-md: 8px;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
      --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --sidebar-w: 260px;
    }
    [data-theme="dark"] {
      --bg-base: #090d16;
      --bg-surface: #111827;
      --bg-subtle: #1f2937;
      --border: #374151;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: rgba(99, 102, 241, 0.15);
      --accent: #10b981;
      --accent-light: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --warning-light: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.15);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    [hidden] { display: none !important; }

    .auth-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.12), transparent 400px), var(--bg-base);
    }
    .auth-card {
      width: min(440px, 100%);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .auth-brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 20px; }
    .brand-box {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: white; display: grid; place-items: center; font-size: 20px; font-weight: 900;
    }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group label { font-size: 13px; font-weight: 700; color: var(--text-muted); }
    .field-wrap {
      position: relative; display: flex; align-items: center;
      background: var(--bg-subtle); border: 1px solid var(--border);
      border-radius: var(--radius-md); overflow: hidden;
    }
    .field-wrap i { position: absolute; left: 14px; color: var(--text-muted); }
    .field-wrap input, .field-wrap select, .field-wrap textarea {
      width: 100%; border: none; background: transparent; padding: 12px 14px 12px 42px; outline: none;
    }
    .auth-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .btn-solid {
      background: var(--primary); color: white; padding: 13px; border-radius: var(--radius-md);
      font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.2s;
    }
    .btn-solid:hover { background: var(--primary-hover); }
    .btn-outline {
      border: 1px solid var(--border); color: var(--text-main); padding: 12px;
      border-radius: var(--radius-md); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .error-banner {
      background: var(--danger-light); color: var(--danger); padding: 10px 14px;
      border-radius: var(--radius-md); font-size: 13px; font-weight: 600;
    }

    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w); background: var(--bg-surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 50;
      padding: 24px 16px;
    }
    .nav-group { display: flex; flex-direction: column; gap: 4px; margin-top: 28px; flex: 1; }
    .nav-link {
      display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 600; color: var(--text-muted); transition: all 0.15s;
    }
    .nav-link:hover { background: var(--bg-subtle); color: var(--text-main); }
    .nav-link.active { background: var(--primary-light); color: var(--primary); }
    .nav-link i { font-size: 17px; }
    .sidebar-user {
      display: flex; align-items: center; gap: 12px; padding: 14px 10px 0;
      border-top: 1px solid var(--border);
    }
    .user-avatar {
      width: 38px; height: 38px; border-radius: 50%; background: var(--primary-light);
      color: var(--primary); font-weight: 800; display: grid; place-items: center; font-size: 13px;
    }

    .main-canvas {
      margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-width: 0;
    }
    .topbar {
      height: 70px; background: var(--bg-surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
      position: sticky; top: 0; z-index: 40;
    }
    .top-controls { display: flex; align-items: center; gap: 12px; }
    .kbd-search {
      display: flex; align-items: center; gap: 10px; background: var(--bg-subtle);
      border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; font-size: 13px;
      color: var(--text-muted); cursor: pointer; width: 260px;
    }
    .kbd-badge {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 6px;
      padding: 2px 6px; font-size: 11px; font-weight: 700; margin-left: auto;
    }
    .btn-circle {
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
      display: grid; place-items: center; color: var(--text-muted); background: var(--bg-surface);
    }

    .content-area { padding: 32px; flex: 1; }
    .section-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; gap: 16px; }
    .section-title h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .section-title p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
    .actions-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .metrics-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .metric-box {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
    }
    .metric-meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .metric-num { font-size: 28px; font-weight: 800; letter-spacing: -1px; }

    .kanban-board {
      display: grid; grid-template-columns: repeat(5, minmax(280px, 1fr)); gap: 16px;
      overflow-x: auto; padding-bottom: 20px; align-items: flex-start;
    }
    .kanban-col {
      background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 580px;
    }
    .kanban-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
    .deal-card {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
      cursor: grab; transition: transform 0.15s, box-shadow 0.15s;
    }
    .deal-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .deal-card h4 { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .deal-val { font-size: 16px; font-weight: 800; color: var(--primary); }

    .table-container {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
      box-shadow: var(--shadow); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      background: var(--bg-subtle); padding: 14px 20px; font-size: 12px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
    }
    td { padding: 16px 20px; border-top: 1px solid var(--border); font-size: 14px; }
    tr:hover td { background: var(--bg-subtle); }

    .modal-veil {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
      z-index: 100; display: grid; place-items: center; padding: 20px;
    }
    .modal-box {
      width: min(580px, 100%); background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column;
    }
    .modal-top { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--border); }
    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; max-height: 75vh; overflow-y: auto; }
    .modal-bottom { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; background: var(--bg-subtle); }

    .cmd-veil {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(6px);
      z-index: 150; display: grid; place-items: start center; padding-top: 12vh;
    }
    .cmd-box {
      width: min(560px, 94vw); background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .cmd-input-wrap {
      display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .cmd-input-wrap input { width: 100%; border: none; outline: none; background: transparent; font-size: 16px; }
    .cmd-list { padding: 10px; max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .cmd-opt {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .cmd-opt:hover { background: var(--primary-light); color: var(--primary); }

    .toast-center { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
    .toast-msg {
      background: var(--text-main); color: var(--bg-surface); padding: 12px 20px; border-radius: var(--radius-md);
      font-size: 13px; font-weight: 700; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px;
    }
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .main-canvas { margin-left: 0; }
    }
  </style>
</head>
<body>

  <section class="auth-wrap" id="authView">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-box">N</div>
        <span>Nexo CRM Ultra</span>
      </div>
      <div>
        <h2 style="font-size: 22px; font-weight: 800;">Iniciar Sesión</h2>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Acceso administrativo vinculado a Google Sheets.</p>
      </div>
      <form id="authForm" style="display: flex; flex-direction: column; gap: 14px;">
        <div class="field-group">
          <label>Email Corporativo</label>
          <div class="field-wrap">
            <i class="bi bi-envelope"></i>
            <input id="loginEmail" type="email" required placeholder="sistemas0226@gmail.com" autocomplete="username">
          </div>
        </div>
        <div class="field-group">
          <label>Contraseña</label>
          <div class="field-wrap">
            <i class="bi bi-shield-lock"></i>
            <input id="loginPassword" type="password" required placeholder="••••••••" autocomplete="current-password">
          </div>
        </div>
        <div class="error-banner" id="authError" hidden></div>
        <div class="auth-actions">
          <button class="btn-solid" type="submit">Entrar al Workspace <i class="bi bi-arrow-right"></i></button>
          <button class="btn-outline" type="button" id="btnDemoLogin"><i class="bi bi-stars"></i> Probar Modo Demo Completo</button>
        </div>
      </form>
    </div>
  </section>

  <div class="app-shell" id="appShell" hidden>
    <aside class="sidebar">
      <div class="auth-brand">
        <div class="brand-box">N</div>
        <span>Nexo CRM</span>
      </div>
      <nav class="nav-group">
        <button class="nav-link active" data-view="dashboard"><i class="bi bi-speedometer2"></i> Resumen</button>
        <button class="nav-link" data-view="pipeline"><i class="bi bi-kanban"></i> Pipeline de Ventas</button>
        <button class="nav-link" data-view="contacts"><i class="bi bi-people"></i> Contactos</button>
      </nav>
      <div class="sidebar-user">
        <div class="user-avatar" id="avatarLetter">PD</div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="userName">Usuario</div>
          <div style="font-size: 11px; color: var(--text-muted);" id="userRole">Administrador</div>
        </div>
        <button class="btn-circle" id="btnLogout" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </aside>

    <main class="main-canvas">
      <header class="topbar">
        <div class="kbd-search" id="btnOpenCmd">
          <i class="bi bi-search"></i>
          <span>Buscar o ejecutar...</span>
          <span class="kbd-badge">Ctrl K</span>
        </div>
        <div class="top-controls">
          <button class="btn-circle" id="btnToggleTheme" title="Cambiar tema"><i class="bi bi-moon-stars"></i></button>
        </div>
      </header>
      <div class="content-area" id="mainContent"></div>
    </main>
  </div>

  <div class="cmd-veil" id="cmdPalette" hidden>
    <div class="cmd-box">
      <div class="cmd-input-wrap">
        <i class="bi bi-search"></i>
        <input id="cmdSearch" placeholder="Escribe un comando o navega..." autofocus>
      </div>
      <div class="cmd-list" id="cmdList">
        <div class="cmd-opt" data-act="nav-dashboard"><i class="bi bi-speedometer2"></i> Ir al Resumen</div>
        <div class="cmd-opt" data-act="nav-pipeline"><i class="bi bi-kanban"></i> Ir al Pipeline de Ventas</div>
        <div class="cmd-opt" data-act="nav-contacts"><i class="bi bi-people"></i> Ir a Contactos</div>
        <div class="cmd-opt" data-act="modal-contact"><i class="bi bi-person-plus"></i> Crear Nuevo Contacto</div>
        <div class="cmd-opt" data-act="modal-opp"><i class="bi bi-plus-circle"></i> Crear Nueva Oportunidad</div>
      </div>
    </div>
  </div>

  <div id="modalSlot"></div>
  <div id="toastSlot" class="toast-center"></div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx1odNoI5JskikYcPeaobBt6Ki3F7SA3IAEOL4DaNBGzLymuE9bwICslv5NHTQWj0aq/exec';
    const STAGES = ['Nuevo', 'Contactado', 'Propuesta', 'Negociación', 'Ganado'];

    const state = {
      theme: localStorage.getItem('nexo_theme') || 'dark',
      view: 'dashboard',
      token: sessionStorage.getItem('nexo_token') || '',
      user: null,
      contacts: [],
      opportunities: [],
      followUps: [],
      quotes: [],
      demo: false
    };

    const $ = (s, r = document) => r.querySelector(s);     const $$ = (s, r = document) => [...r.querySelectorAll(s)];

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', state.theme);
      const icon = $('#btnToggleTheme i');
      if (icon) icon.className = state.theme === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
      localStorage.setItem('nexo_theme', state.theme);
    }

    function toast(text) {
      const el = document.createElement('div');
      el.className = 'toast-msg';
      el.innerHTML = `<i class="bi bi-check2-circle"></i> <span>${text}</span>`;
      $('#toastSlot').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    async function api(action, payload = {}) {
      if (state.demo) return demoBackend(action, payload);
      let res;
      try {
        res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, token: state.token, ...payload })
        });
      } catch (err) {
        throw new Error('Error al conectar con el servidor Apps Script.');
      }
      const raw = await res.text();
      let parsed;
      try { parsed = JSON.parse(raw); }
      catch (_) { throw new Error('Respuesta inválida recibida del servidor.'); }
      if (!parsed.ok) throw new Error(parsed.error || 'Operación rechazada.');
      return parsed;
    }

    async function loadBackendData() {
      const data = await api('bootstrap');
      state.user = data.user || state.user;
      state.contacts = data.contacts || [];
      state.opportunities = data.opportunities || [];
      state.followUps = data.followUps || [];
      state.quotes = data.quotes || [];
    }

    function renderDashboard() {
      const totalOppVal = state.opportunities.reduce((acc, x) => acc + Number(x.value || 0), 0);
      const wonDeals = state.opportunities.filter(x => x.stage === 'Ganado');
      const wonVal = wonDeals.reduce((acc, x) => acc + Number(x.value || 0), 0);
      return `
        <div class="section-head">
          <div class="section-title">
            <h1>Hola, ${(state.user?.name || 'Usuario').split(' ')[0]}</h1>
            <p>Estado operativo y comercial actualizado.</p>
          </div>
          <div class="actions-row">
            <button class="btn-solid" onclick="openContactModal()"><i class="bi bi-person-plus"></i> Contacto</button>
            <button class="btn-solid" onclick="openOppModal()"><i class="bi bi-plus-lg"></i> Oportunidad</button>
          </div>
        </div>
        <div class="metrics-row">
          <div class="metric-box">
            <div class="metric-meta"><span>Pipeline Activo</span><i class="bi bi-graph-up"></i></div>
            <div class="metric-num">$ ${totalOppVal.toLocaleString('es-AR')}</div>
          </div>
          <div class="metric-box">
            <div class="metric-meta"><span>Negocios Ganados</span><i class="bi bi-trophy"></i></div>
            <div class="metric-num">$ ${wonVal.toLocaleString('es-AR')}</div>
          </div>
          <div class="metric-box">
            <div class="metric-meta"><span>Contactos Registrados</span><i class="bi bi-people"></i></div>
            <div class="metric-num">${state.contacts.length}</div>
          </div>
          <div class="metric-box">
            <div class="metric-meta"><span>Seguimientos Pendientes</span><i class="bi bi-clock"></i></div>
            <div class="metric-num">${state.followUps.filter(x => x.status !== 'Completado').length}</div>
          </div>
        </div>
        <div class="table-container">
          <div style="padding: 18px 20px; font-weight: 700; border-bottom: 1px solid var(--border);">Últimas Oportunidades</div>
          <table>
            <thead><tr><th>Título</th><th>Etapa</th><th>Valor</th><th>Responsable</th></tr></thead>
            <tbody>
              ${state.opportunities.slice(0, 5).map(opp => `
                <tr>
                  <td><b>${opp.title}</b></td>
                  <td><span style="background:var(--primary-light);color:var(--primary);padding:4px 8px;border-radius:6px;font-size:12px;font-weight:700;">${opp.stage}</span></td>                   <td>$ ${Number(opp.value || 0).toLocaleString('es-AR')}</td>
                  <td>${opp.owner || 'Sin asignar'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderPipeline() {
      return `
        <div class="section-head">
          <div class="section-title">
            <h1>Pipeline de Ventas</h1>
            <p>Arrastrá las tarjetas para avanzar en el embudo comercial.</p>
          </div>
          <button class="btn-solid" onclick="openOppModal()"><i class="bi bi-plus-lg"></i> Nueva Oportunidad</button>
        </div>
        <div class="kanban-board">
          ${STAGES.map(stage => {
            const list = state.opportunities.filter(x => x.stage === stage);
            const total = list.reduce((a, b) => a + Number(b.value || 0), 0);
            return `
              <div class="kanban-col" data-stage="${stage}" ondragover="event.preventDefault()" ondrop="dropOpp(event, '${stage}')">
                <div class="kanban-header">
                  <span>${stage}</span>                   <span style="font-size:12px;color:var(--text-muted);">$ ${total.toLocaleString('es-AR')}</span>
                </div>
                ${list.map(deal => `
                  <div class="deal-card" draggable="true" ondragstart="dragOpp(event, '${deal.id}')">
                    <h4>${deal.title}</h4>
                    <div class="deal-val">$ ${Number(deal.value || 0).toLocaleString('es-AR')}</div>
                    <div style="font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between;">
                      <span>${deal.owner || 'Sin asignar'}</span>
                      <span>${deal.probability || 10}%</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderContacts() {
      return `
        <div class="section-head">
          <div class="section-title">
            <h1>Base de Contactos</h1>
            <p>Directorio centralizado de clientes y prospectos.</p>
          </div>
          <div class="actions-row">
            <button class="btn-outline" onclick="exportContactsCSV()"><i class="bi bi-download"></i> Exportar CSV</button>
            <button class="btn-solid" onclick="openContactModal()"><i class="bi bi-person-plus"></i> Nuevo Contacto</button>
          </div>
        </div>
        <div class="table-container">
          <table>
            <thead><tr><th>Nombre</th><th>Empresa</th><th>Email</th><th>Teléfono</th><th>Estado</th></tr></thead>
            <tbody>
              ${state.contacts.map(c => `
                <tr>
                  <td><b>${c.name}</b></td>
                  <td>${c.company || '—'}</td>
                  <td>${c.email || '—'}</td>
                  <td>${c.phone || '—'}</td>
                  <td><span style="background:var(--accent-light);color:var(--accent);padding:4px 8px;border-radius:6px;font-size:12px;font-weight:700;">${c.status}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderView() {
      const views = { dashboard: renderDashboard, pipeline: renderPipeline, contacts: renderContacts };
      $('#mainContent').innerHTML = (views[state.view] \vert{}\vert{} views.dashboard)();       $$('.nav-link').forEach(btn => btn.classList.toggle('active', btn.dataset.view === state.view));
    }

    function dragOpp(e, id) { e.dataTransfer.setData('text/plain', id); }
    async function dropOpp(e, newStage) {
      const id = e.dataTransfer.getData('text/plain');
      const item = state.opportunities.find(x => x.id === id);
      if (item && item.stage !== newStage) {
        item.stage = newStage;
        renderView();
        await api('changeStage', { id, stage: newStage });
        toast(`Oportunidad movida a ${newStage}`);
      }
    }

    function openContactModal() {
      $('#modalSlot').innerHTML = `
        <div class="modal-veil" onclick="if(event.target===this)$('#modalSlot').innerHTML=''">
          <div class="modal-box">
            <div class="modal-top"><h3>Nuevo Contacto</h3><button onclick="$('#modalSlot').innerHTML=''"><i class="bi bi-x-lg"></i></button></div>
            <form id="contactForm">
              <div class="modal-body">
                <div class="field-group"><label>Nombre</label><input class="field-wrap" style="padding:10px" name="name" required placeholder="Nombre completo"></div>
                <div class="field-group"><label>Empresa</label><input class="field-wrap" style="padding:10px" name="company" placeholder="Empresa S.A."></div>
                <div class="field-group"><label>Email</label><input class="field-wrap" style="padding:10px" name="email" type="email" placeholder="correo@empresa.com"></div>
                <div class="field-group"><label>Teléfono</label><input class="field-wrap" style="padding:10px" name="phone" placeholder="+54..."></div>
              </div>
              <div class="modal-bottom">
                <button class="btn-outline" type="button" onclick="$('#modalSlot').innerHTML=''">Cancelar</button>
                <button class="btn-solid" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      `;
      $('#contactForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        const res = await api('saveContact', { data });
        state.contacts.push(res.item);
        $('#modalSlot').innerHTML = '';
        renderView();
        toast('Contacto creado con éxito');
      };
    }

    function openOppModal() {
      $('#modalSlot').innerHTML = `
        <div class="modal-veil" onclick="if(event.target===this)$('#modalSlot').innerHTML=''">
          <div class="modal-box">
            <div class="modal-top"><h3>Nueva Oportunidad</h3><button onclick="$('#modalSlot').innerHTML=''"><i class="bi bi-x-lg"></i></button></div>
            <form id="oppForm">
              <div class="modal-body">
                <div class="field-group"><label>Título</label><input class="field-wrap" style="padding:10px" name="title" required placeholder="Ej: Renovación de Software"></div>
                <div class="field-group"><label>Valor Estimado</label><input class="field-wrap" style="padding:10px" name="value" type="number" required placeholder="0"></div>
                <div class="field-group"><label>Etapa</label>
                  <select class="field-wrap" style="padding:10px" name="stage">
                    ${STAGES.map(s => `<option value="${s}">${s}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="modal-bottom">
                <button class="btn-outline" type="button" onclick="$('#modalSlot').innerHTML=''">Cancelar</button>
                <button class="btn-solid" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      `;
      $('#oppForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        data.value = Number(data.value || 0);
        const res = await api('saveOpportunity', { data });
        state.opportunities.push(res.item);
        $('#modalSlot').innerHTML = '';
        renderView();
        toast('Oportunidad registrada');
      };
    }

    function exportContactsCSV() {
      const headers = ['Nombre', 'Empresa', 'Email', 'Telefono', 'Estado'];
      const rows = state.contacts.map(c => [
        c.name || '',
        c.company || '',
        c.email || '',
        c.phone || '',
        c.status || ''
      ]);
      const content = [headers, ...rows].map(row =>
        row.map(val => '"' + String(val).replace(/"/g, '""') + '"').join(',')
      ).join('\r\n');

      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', 'contactos_' + new Date().toISOString().slice(0, 10) + '.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function showApp() {
      $('#authView').hidden = true;
      $('#appShell').hidden = false;
      $('#userName').textContent = state.user?.name || 'Administrador';
      $('#avatarLetter').textContent = (state.user?.name || 'AD').slice(0, 2).toUpperCase();
      renderView();
    }

    $('#authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('#loginEmail').value.trim();
      const password = $('#loginPassword').value.trim();
      const errBox = $('#authError');
      errBox.hidden = true;

      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        const res = await api('login', { email, password });
        state.token = res.token;
        state.user = res.user;
        sessionStorage.setItem('nexo_token', state.token);
        await loadBackendData();
        showApp();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.hidden = false;
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Entrar al Workspace <i class="bi bi-arrow-right"></i>';
      }
    });

    $('#btnDemoLogin').addEventListener('click', () => {
      state.demo = true;
      state.user = { name: 'Usuario Demo', role: 'admin' };
      state.contacts = [
        { id: '1', name: 'Laura Gómez', company: 'Global Tech', email: 'laura@global.com', phone: '+54 11 4444 2222', status: 'Cliente' },
        { id: '2', name: 'Carlos Díaz', company: 'Innovar SA', email: 'cdiaz@innovar.ar', phone: '+54 261 400 1122', status: 'Prospecto' }
      ];
      state.opportunities = [
        { id: '101', title: 'Consultoría ERP Cloud', value: 850000, stage: 'Propuesta', probability: 50, owner: 'Usuario Demo' },
        { id: '102', title: 'Infraestructura Redes', value: 340000, stage: 'Contactado', probability: 25, owner: 'Usuario Demo' }
      ];
      showApp();
    });

    $('#btnLogout').addEventListener('click', () => {
      sessionStorage.removeItem('nexo_token');
      location.reload();
    });

    $('#btnToggleTheme').addEventListener('click', () => {       state.theme = state.theme === 'dark' ? 'light' : 'dark';       applyTheme();     });      $$('.nav-link').forEach(btn => {
      btn.addEventListener('click', () => {
        state.view = btn.dataset.view;
        renderView();
      });
    });

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        $('#cmdPalette').hidden = !$('#cmdPalette').hidden;
      } else if (e.key === 'Escape') {
        $('#cmdPalette').hidden = true;
        $('#modalSlot').innerHTML = '';
      }
    });

    $('#btnOpenCmd').addEventListener('click', () => $('#cmdPalette').hidden = false);
    $('#cmdPalette').addEventListener('click', (e) => { if (e.target === $('#cmdPalette')) $('#cmdPalette').hidden = true; });      $$('.cmd-opt').forEach(opt => {
      opt.addEventListener('click', () => {
        const act = opt.dataset.act;
        $('#cmdPalette').hidden = true;
        if (act === 'nav-dashboard') { state.view = 'dashboard'; renderView(); }
        else if (act === 'nav-pipeline') { state.view = 'pipeline'; renderView(); }
        else if (act === 'nav-contacts') { state.view = 'contacts'; renderView(); }
        else if (act === 'modal-contact') { openContactModal(); }
        else if (act === 'modal-opp') { openOppModal(); }
      });
    });

    applyTheme();
  </script>
</body>
</html>
